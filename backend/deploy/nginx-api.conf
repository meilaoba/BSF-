# Add inside the existing `server { ... }` block that serves the dashboard.
# Then: nginx -t && systemctl reload nginx

location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Never let a browser cache alert or credential state.
    add_header Cache-Control "no-store" always;
}

# Optional: keep database and queue internals out of the public surface.
location ~ ^/api/v1/(audit-logs|notification-preferences)$ {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:3000;
}
