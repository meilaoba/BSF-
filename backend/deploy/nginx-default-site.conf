server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # ------------------------------------------------------------------
    # BSF backend API: notification queue, alert rules, customer records.
    #
    # This location MUST stay scoped to /api/v1/ .
    # The dashboard server on 127.0.0.1:4180 also owns paths under /api/ -
    # its same-origin MQTT bridge lives at /api/gateway/... . A broader
    # `location /api/` rule swallows those requests and answers 404, which
    # silently kills the live device data on every page.
    # Anything that is not /api/v1/ therefore falls through to `location /`.
    # ------------------------------------------------------------------
    location /api/v1/ {
        limit_req zone=bsf_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        client_max_body_size 256k;

        # Alert and credential state must never be cached by a browser.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # Sends are rate limited harder: they consume vendor quota.
    location ~ ^/api/v1/(notifications|alerts)/ {
        limit_req zone=bsf_api_write burst=10 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        client_max_body_size 256k;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # ------------------------------------------------------------------
    # Dashboard and its same-origin MQTT bridge (/api/gateway/...).
    # Keep the no-cache headers: without them the browser serves stale
    # readings instead of updating in place.
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
}