server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # ------------------------------------------------------------------
    # Backend API (notification queue, alert rules, customer records)
    # ------------------------------------------------------------------
    location /api/ {
        limit_req zone=bsf_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        client_max_body_size 256k;

        # Alert and credential state must never be cached by a browser.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # Writes are rate limited harder: these endpoints consume vendor quota.
    location ~ ^/api/v1/(notifications|alerts)/ {
        limit_req zone=bsf_api_write burst=10 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        client_max_body_size 256k;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # ------------------------------------------------------------------
    # Dashboard
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
}