# Rate limiting for the BSF backend API.
# Declared in the http context (conf.d) so it can be referenced from the
# dashboard server block.
limit_req_zone $binary_remote_addr zone=bsf_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=bsf_api_write:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=bsf_auth:10m rate=5r/s;

# Keep a noisy chart tab from exhausting the shared API bucket. The frontend
# creates one client-instance header per tab, so a damaged cached page can
# retry without blocking login or ordinary API calls from another tab.
limit_req_zone $binary_remote_addr$cookie_bsf_session$http_x_bsf_client_instance zone=bsf_graph:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=bsf_conn:10m;
