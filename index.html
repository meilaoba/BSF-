<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BSF Smart Kitchen Waste IoT</title>
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
<div id="app" style="min-height:100vh;background:#0f172a;color:#e2e8f0;font-family:'Inter',system-ui,-apple-system,sans-serif;">
  <div id="login-screen" style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;">
    <div style="width:100%;max-width:420px;background:#1e293b;border-radius:16px;padding:40px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);border:1px solid #334155;">
      <div style="text-align:center;margin-bottom:32px;">
        <div style="width:64px;height:64px;background:linear-gradient(135deg,#10b981,#059669);border-radius:16px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:28px;">🌱</div>
        <h1 style="font-size:24px;font-weight:700;color:#f8fafc;margin:0;">Smart Kitchen Waste IoT</h1>
        <p style="color:#94a3b8;margin-top:8px;font-size:14px;">Monitoring & Management Platform</p>
      </div>
      <div style="margin-bottom:20px;">
        <label style="display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;">Role</label>
        <select id="role-select" style="width:100%;padding:12px 16px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:14px;outline:none;cursor:pointer;">
          <option value="admin">Master Admin</option>
          <option value="client-admin">Client Admin</option>
          <option value="user">User</option>
        </select>
      </div>
      <div style="margin-bottom:20px;">
        <label style="display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;">Email / Username</label>
        <input type="text" value="admin@platform.hk" style="width:100%;padding:12px 16px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:14px;outline:none;box-sizing:border-box;" />
      </div>
      <div style="margin-bottom:24px;">
        <label style="display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;">Password</label>
        <input type="password" value="********" style="width:100%;padding:12px 16px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:14px;outline:none;box-sizing:border-box;" />
      </div>
      <button onclick="login()" style="width:100%;padding:14px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:8px;color:#fff;font-weight:600;font-size:15px;cursor:pointer;transition:all 0.2s;">Sign In</button>
      <p style="text-align:center;color:#64748b;font-size:12px;margin-top:16px;">Forgot password? Contact system administrator</p>
    </div>
  </div>

  <div id="main-app" style="display:none;">
    <div style="height:64px;background:#1e293b;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:50;">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:36px;height:36px;background:linear-gradient(135deg,#10b981,#059669);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;">🌱</div>
        <span style="font-weight:700;font-size:16px;color:#f8fafc;">Smart Kitchen Waste IoT</span>
        <span id="role-badge" style="padding:4px 10px;background:#334155;border-radius:20px;font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;">Master Admin</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px;">
        <div style="position:relative;">
          <span style="font-size:20px;cursor:pointer;">🔔</span>
          <span style="position:absolute;top:-4px;right:-4px;width:16px;height:16px;background:#ef4444;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;">3</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <div style="width:32px;height:32px;background:linear-gradient(135deg,#3b82f6,#2563eb);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;">AD</div>
          <span style="font-size:14px;color:#e2e8f0;">Master Admin</span>
        </div>
        <button onclick="logout()" style="padding:6px 14px;background:#334155;border:none;border-radius:6px;color:#e2e8f0;font-size:12px;cursor:pointer;">Logout</button>
      </div>
    </div>

    <div style="display:flex;min-height:calc(100vh - 64px);">
      <div id="sidebar" style="width:260px;background:#1e293b;border-right:1px solid #334155;padding:20px 0;display:flex;flex-direction:column;position:fixed;height:100%;overflow-y:auto;">
        <div id="client-name" style="padding:0 20px 16px;font-size:12px;font-weight:700;color:#10b981;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #334155;margin-bottom:8px;">GreenCity Solutions Ltd</div>
        <nav id="nav-menu" style="flex:1;"></nav>
        <div style="padding:16px 20px;border-top:1px solid #334155;margin-top:auto;">
          <p style="font-size:11px;color:#64748b;margin:0;">Powered by</p>
          <p style="font-size:13px;color:#94a3b8;font-weight:600;margin:4px 0 0;">IoT Tech Systems</p>
        </div>
      </div>
      <div style="margin-left:260px;flex:1;padding:28px;background:#0f172a;min-height:calc(100vh - 64px);">
        <div id="page-content"></div>
      </div>
    </div>
  </div>
</div>
    <script type="module" src="/src/main.js"></script>
    <script src="/src/ui/state.js"></script>
    <script src="/src/ui/data.js"></script>
    <script src="/src/ui/gateway-data.js"></script>
    <script src="/src/ui/router.js"></script>
    <script src="/src/ui/pages/machines.js"></script>
    <script src="/src/ui/pages/locations.js"></script>
    <script src="/src/ui/pages/graphs.js"></script>
    <script src="/src/ui/pages/raw-data.js"></script>
    <script src="/src/ui/pages/reports.js"></script>
    <script src="/src/ui/pages/alerts.js"></script>
    <script src="/src/ui/pages/clients.js"></script>
    <script src="/src/ui/pages/users.js"></script>
    <script src="/src/ui/pages/system.js"></script>
    <script src="/src/ui/pages/logs.js"></script>
    <script src="/src/ui/pages/api.js"></script>
    <script src="/src/ui/pages/account.js"></script>
  </body>
</html>
